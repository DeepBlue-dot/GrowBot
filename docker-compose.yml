version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16
    container_name: growbot_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user1234
      POSTGRES_DB: mydb
      TZ: Africa/Addis_Ababa
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - growbot_network

  # NestJS Backend API & Telegram Bot Engine
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: growbot_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://user:user1234@postgres:5432/mydb?schema=public"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-"7890123456:ABCdefGHIjklMNOpqrsTUVwxyz123456"}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-"growbot_secret_token_123"}
      JWT_SECRET: ${JWT_SECRET:-"growbot_secret_key"}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - growbot_network

  # Web Dashboard & Telegram Mini App Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: growbot_web
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - api
    networks:
      - growbot_network

networks:
  growbot_network:
    driver: bridge

volumes:
  postgres_data:
